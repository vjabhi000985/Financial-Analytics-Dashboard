version: '3.8'

services:
  api:
    build: .
    container_name: analytics_api
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    environment:
      # These variables tell FastAPI to connect to the Docker service names
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_HOST=redis
      
  mongodb:
    image: mongo:latest
    container_name: analytics_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: analytics_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data: # Ensures MongoDB data persists if the container restarts